<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ef">
    <title>APEX | CSV Profiler</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="APEX home">
          <span class="wordmark-mark" aria-hidden="true">A</span>
          <span>APEX <span class="wordmark-divider">/</span> Schema tools</span>
        </a>
        <span class="service-label"><span class="service-dot"></span> CSV profiler</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">DATA WORKSPACE <span>01</span></p>
          <h1 id="page-title">Start with your<br><span>source files.</span></h1>
          <p class="intro-copy">Choose CSV files to prepare a profiling batch.</p>
        </section>

        <section class="upload-panel" aria-label="Upload CSV files">
          <label class="drop-zone" id="dropZone" for="csvFiles">
            <input id="csvFiles" type="file" accept=".csv,text/csv" multiple>
            <span class="upload-symbol" aria-hidden="true">+</span>
            <span class="drop-title">Drop CSV files here</span>
            <span class="drop-caption">or <span class="browse-link">browse files</span></span>
            <span class="file-limit">CSV format · up to 10 MiB per file</span>
          </label>

          <div class="selection" id="selection" hidden>
            <div class="selection-heading">
              <span class="section-label">SELECTED FILES</span>
              <button class="text-button" id="clearFiles" type="button">Clear all</button>
            </div>
            <ul class="file-list" id="fileList" aria-live="polite"></ul>
          </div>

          <div class="action-row">
            <p class="selection-count" id="selectionCount">No files selected</p>
            <button class="profile-button" id="profileFiles" type="button" disabled>Profile CSVs</button>
          </div>
          <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </section>

      </main>

      <footer class="footer"><span>APEX SCHEMA NORMALIZATION</span><span>LOCAL WORKSPACE</span></footer>
    </div>
  </body>
</html>
